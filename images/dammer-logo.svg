  <title id="title">DAMMER 700 zwart drukwerklogo</title>
  <desc id="desc">Handmatig geometrisch opgebouwd DAMMER 700-logo, volledig zwart.</desc>
  <metadata>
    Print master version 4. Hand-drawn native vector outlines based on the
    approved DAMMER 700 design. No fonts, text, raster images, clipping masks,
    strokes, filters, gradients or transparency effects. All straight edges
    are mathematically straight; repeated elements are exactly symmetric.
    Single colour: #000000.
