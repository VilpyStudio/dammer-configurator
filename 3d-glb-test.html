<!doctype html>
<html lang="nl">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Dammer 3D Configurator</title>
    <meta name="description" content="Bekijk en configureer de Dammer in 3D.">
    <link rel="preload" href="images/dammer-boat-blender-v3-web.glb?v=1" as="fetch" type="model/gltf-binary" crossorigin>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700;800&display=swap" rel="stylesheet">
    <style>
      :root {
        --ink: #172019;
        --muted: #667069;
        --line: #dfe3df;
        --green: #174d2c;
        --paper: #fff;
        --font-main: "Archivo", Arial, Helvetica, sans-serif;
      }

      * {
        box-sizing: border-box;
      }

      html {
        background: #f4f6f3;
        touch-action: manipulation;
      }

      body {
        margin: 0;
        min-width: 320px;
        background: #fbfcfa;
        color: var(--ink);
        font-family: var(--font-main);
        -webkit-text-size-adjust: 100%;
      }

      button {
        -webkit-tap-highlight-color: transparent;
        font: inherit;
      }

      .site-shell {
        min-height: 100vh;
      }

      .topbar {
        align-items: center;
        background: var(--paper);
        border-bottom: 1px solid var(--line);
        display: flex;
        height: 82px;
        justify-content: space-between;
        padding: 0 clamp(24px, 4vw, 72px);
      }

      .brand img {
        display: block;
        height: auto;
        max-width: min(280px, 48vw);
        width: 230px;
      }

      .topbar-actions {
        align-items: center;
        display: flex;
        gap: 22px;
      }

      .reset-button,
      .flat-link,
      .original-link {
        background: transparent;
        border: 0;
        color: #4d5850;
        cursor: pointer;
        font-size: 13px;
        font-weight: 700;
        text-decoration: underline;
        text-decoration-color: #aeb5af;
        text-underline-offset: 5px;
      }

      .configurator {
        display: grid;
        grid-template-columns: minmax(0, 1fr) minmax(340px, 440px);
        min-height: calc(100vh - 82px);
      }

      .viewer {
        background: radial-gradient(circle at 58% 47%, rgba(255,255,255,.98), rgba(248,249,246,.86) 48%, rgba(241,244,240,.94) 86%), #f3f5f1;
        display: grid;
        grid-template-rows: auto minmax(0, 1fr) auto;
        overflow: hidden;
        padding: clamp(26px, 3.2vw, 48px) clamp(24px, 4vw, 66px) 18px;
        position: relative;
      }

      .viewer-copy {
        position: relative;
        z-index: 2;
      }

      .viewer-copy span {
        color: var(--green);
        display: block;
        font-size: 12px;
        font-weight: 700;
        letter-spacing: 0;
        margin-bottom: 14px;
        text-transform: uppercase;
      }

      .viewer-copy h1 {
        font-size: clamp(30px, 3vw, 48px);
        font-weight: 700;
        letter-spacing: 0;
        line-height: 1.06;
        margin: 0;
        max-width: 680px;
      }

      .stage {
        min-height: 0;
        position: relative;
      }

      .stage canvas {
        display: block;
        height: 100%;
        min-height: 560px;
        outline: none;
        touch-action: none;
        width: 100%;
      }

      .loader {
        color: #717a73;
        font-size: 13px;
        left: 50%;
        position: absolute;
        top: 50%;
        transform: translate(-50%, -50%);
        z-index: 2;
      }

      .viewer-note {
        color: #7a817c;
        font-size: 10px;
        margin: 0;
        position: relative;
        text-align: center;
        z-index: 2;
      }

      .controls {
        background: var(--paper);
        border-left: 1px solid var(--line);
        padding: clamp(34px, 4vw, 64px) clamp(28px, 3.4vw, 52px);
      }

      .controls-intro {
        align-items: center;
        border-bottom: 1px solid var(--line);
        display: flex;
        gap: 14px;
        padding-bottom: 26px;
      }

      .step {
        align-items: center;
        background: var(--green);
        border-radius: 50%;
        color: #fff;
        display: flex;
        font-size: 11px;
        font-weight: 700;
        height: 38px;
        justify-content: center;
        width: 38px;
      }

      .controls-intro p {
        color: #7b837d;
        font-size: 10px;
        font-weight: 700;
        letter-spacing: 0;
        margin: 0 0 6px;
        text-transform: uppercase;
      }

      .controls-intro h2 {
        font-size: 25px;
        font-weight: 700;
        letter-spacing: 0;
        line-height: 1;
        margin: 0;
      }

      .control-group {
        border-bottom: 1px solid var(--line);
        padding: 27px 0;
      }

      .control-heading {
        align-items: baseline;
        display: flex;
        justify-content: space-between;
        margin-bottom: 17px;
      }

      .control-heading h2 {
        font-size: 14px;
        font-weight: 700;
        margin: 0;
      }

      .control-heading span {
        color: #788179;
        font-size: 11px;
        font-weight: 600;
      }

      .swatches {
        display: flex;
        flex-wrap: wrap;
        gap: 11px;
      }

      .swatch {
        background: var(--swatch, #fff);
        border: 3px solid #fff;
        border-radius: 50%;
        box-shadow: 0 0 0 1px #cdd2ce;
        cursor: pointer;
        height: 38px;
        position: relative;
        transition: transform .15s ease, box-shadow .15s ease;
        width: 38px;
      }

      .swatch:hover {
        transform: translateY(-2px);
      }

      .swatch.selected {
        box-shadow: 0 0 0 2px var(--green), 0 4px 10px rgba(23,77,44,.18);
      }

      .swatch.selected::after {
        border: solid #fff;
        border-width: 0 2px 2px 0;
        content: "";
        height: 8px;
        left: 13px;
        position: absolute;
        top: 10px;
        transform: rotate(45deg);
        width: 4px;
      }

      .original-link {
        font-size: 10px;
        font-weight: 600;
        margin-top: 15px;
        padding: 0;
      }

      .download-button {
        align-items: center;
        background: var(--green);
        border: 0;
        color: #fff;
        cursor: pointer;
        display: flex;
        font-size: 13px;
        font-weight: 700;
        justify-content: space-between;
        margin-top: 30px;
        padding: 17px 19px;
        transition: background .18s ease, transform .18s ease;
        width: 100%;
      }

      .download-button:hover:not(:disabled) {
        background: #0e3d20;
        transform: translateY(-1px);
      }

      .download-button:disabled {
        cursor: wait;
        opacity: .55;
      }

      .save-note {
        color: #858c87;
        font-size: 10px;
        margin: 10px 0 0;
        text-align: center;
      }

      @media (max-width: 1000px) {
        .configurator {
          grid-template-columns: 1fr;
        }

        .viewer {
          min-height: 680px;
        }

        .stage canvas {
          min-height: 500px;
        }

        .controls {
          border-left: 0;
          border-top: 1px solid var(--line);
        }
      }

      @media (max-width: 540px) {
        .topbar {
          height: 70px;
          padding: 0 18px;
        }

        .brand img {
          max-width: 185px;
        }

        .topbar-actions {
          gap: 14px;
        }

        .reset-button,
        .flat-link {
          font-size: 11px;
        }

        .configurator {
          min-height: calc(100vh - 70px);
        }

        .viewer {
          min-height: 560px;
          padding: 28px 18px 18px;
        }

        .viewer-copy h1 {
          font-size: 31px;
        }

        .stage canvas {
          min-height: 380px;
        }

        .controls {
          padding: 34px 22px 42px;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          scroll-behavior: auto !important;
          transition: none !important;
        }
      }
    </style>
  </head>
  <body>
    <main class="site-shell">
      <header class="topbar">
        <a class="brand" href="index.html" aria-label="Dammer configurator">
          <img src="images/dammer-logo.svg" alt="Dammer 700">
        </a>
        <div class="topbar-actions">
          <a class="flat-link" href="360.html">360 render</a>
          <button class="reset-button" type="button" data-reset>Opnieuw instellen</button>
        </div>
      </header>

      <div class="configurator">
        <section class="viewer" aria-label="3D voorbeeld van de samengestelde Dammer">
          <div class="viewer-copy">
            <span>3D testversie</span>
            <h1>Maak de Dammer van jou.</h1>
          </div>
          <div class="stage" data-stage>
            <div class="loader" data-loader>Dammer wordt geladen...</div>
          </div>
          <p class="viewer-note">Kleuren op het scherm kunnen afwijken van de werkelijke materialen.</p>
        </section>

        <aside class="controls">
          <div class="controls-intro">
            <span class="step">01</span>
            <div>
              <p>Exterieur &amp; interieur</p>
              <h2>Kies je kleuren</h2>
            </div>
          </div>

          <section class="control-group" aria-labelledby="romp-title" data-panel="hull">
            <div class="control-heading">
              <h2 id="romp-title">Romp</h2>
              <span data-chosen>Origineel</span>
            </div>
            <div class="swatches"></div>
            <button class="original-link" type="button">Gebruik originele kleur</button>
          </section>

          <section class="control-group" aria-labelledby="kussens-title" data-panel="cushions">
            <div class="control-heading">
              <h2 id="kussens-title">Kussens</h2>
              <span data-chosen>Origineel</span>
            </div>
            <div class="swatches"></div>
            <button class="original-link" type="button">Gebruik originele kleur</button>
          </section>

          <section class="control-group" aria-labelledby="teak-title" data-panel="teak">
            <div class="control-heading">
              <h2 id="teak-title">Teakdeck</h2>
              <span data-chosen>Origineel</span>
            </div>
            <div class="swatches"></div>
            <button class="original-link" type="button">Gebruik originele kleur</button>
          </section>

          <button class="download-button" type="button" data-download disabled>
            <span>Download jouw ontwerp</span>
            <span aria-hidden="true">&#8595;</span>
          </button>
          <p class="save-note">Je ontwerp wordt als PNG opgeslagen.</p>
        </aside>
      </div>
    </main>

    <script>
      (function () {
        var force3d = /(?:\?|&)force3d=1(?:&|$)/.test(window.location.search);
        var userAgent = navigator.userAgent || "";
        var androidMatch = userAgent.match(/Android\s+(\d+(?:\.\d+)?)/i);
        var androidVersion = androidMatch ? parseFloat(androidMatch[1]) : null;
        var isAndroid = /Android/i.test(userAgent);
        var supportsModules = "noModule" in document.createElement("script");
        var supportsImportMap = !!(
          window.HTMLScriptElement &&
          HTMLScriptElement.supports &&
          HTMLScriptElement.supports("importmap")
        );

        function supportsWebGL() {
          try {
            var canvas = document.createElement("canvas");
            return !!(
              window.WebGLRenderingContext &&
              (canvas.getContext("webgl") || canvas.getContext("experimental-webgl"))
            );
          } catch (error) {
            return false;
          }
        }

        var lowMemoryAndroid = isAndroid && navigator.deviceMemory && navigator.deviceMemory <= 2;
        var fallbackReason = "";
        if (!supportsModules) fallbackReason = "nomodule";
        else if (!supportsImportMap) fallbackReason = "no-importmap";
        else if (!supportsWebGL()) fallbackReason = "no-webgl";
        else if (androidVersion && androidVersion < 8) fallbackReason = "legacy-android";
        else if (lowMemoryAndroid) fallbackReason = "low-memory-android";

        window.__dammer3dCompat = {
          force3d: force3d,
          fallbackReason: fallbackReason,
          isAndroid: isAndroid,
          lowMemory: !!lowMemoryAndroid,
          maxPixelRatio: isAndroid || lowMemoryAndroid ? 1 : 2,
          loadTimeoutMs: isAndroid ? 18000 : 30000
        };

        if (fallbackReason && !force3d) {
          window.location.replace("360.html?fallback=" + encodeURIComponent(fallbackReason));
        }
      })();
    </script>
    <script nomodule>
      window.location.replace("360.html?fallback=nomodule");
    </script>
    <script type="importmap">
      {
        "imports": {
          "three": "https://cdn.jsdelivr.net/npm/three@0.166.1/build/three.module.js",
          "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.166.1/examples/jsm/"
        }
      }
    </script>
    <script type="module">
      import * as THREE from "three";
      import { OrbitControls } from "three/addons/controls/OrbitControls.js";
      import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";

      const compat = window.__dammer3dCompat || {};

      const colors = {
        hull: [
          { name: "RAL 9010", value: "#f1ede1" },
          { name: "RAL 1013", value: "#e3d9c6" },
          { name: "RAL 6034", value: "#7fb5b5" },
          { name: "RAL 7033", value: "#7d8471" },
          { name: "RAL 7034", value: "#928e85" },
          { name: "RAL 7038", value: "#b5b8b1" },
          { name: "RAL 7039", value: "#6c6960" },
        ],
        cushions: [
          { name: "Cognac", value: "#b96936" },
          { name: "Creme", value: "#d8ccb4" },
          { name: "Taupe", value: "#877768" },
          { name: "Donkerbruin", value: "#49362d" },
          { name: "Marine", value: "#293f55" },
          { name: "Lichtgrijs", value: "#b7b8b5" },
        ],
        teak: [
          { name: "Naturel teak", value: "#c98f4d" },
          { name: "Honing teak", value: "#d6a864" },
          { name: "Licht eiken", value: "#d4bd91" },
          { name: "Vergrijsd teak", value: "#928b7b" },
        ],
      };

      const defaultColors = {
        hull: "#080907",
        cushions: "#e2b9a5",
        teak: "#9b9283",
      };

      const roleMaterials = {
        hull: new Set(["config_hull"]),
        cushions: new Set(["config_cushions"]),
        teak: new Set(["config_teak"]),
      };

      const fixedMaterialStyles = {
        "fixed_white_plastic": { color: "#f2f1ec", roughness: 0.48, metalness: 0 },
        "fixed_inner_body": { color: "#f1ede7", roughness: 0.5, metalness: 0 },
        "fixed_dark_trim": { color: "#4a1c17", roughness: 0.42, metalness: 0, clearMaps: true },
        "fixed_steering_wood": { color: "#8c562f", roughness: 0.46, metalness: 0 },
        "fixed_metal": { color: "#c4c4bc", roughness: 0.22, metalness: 0.85 },
        "fixed_black_metal": { color: "#111410", roughness: 0.28, metalness: 0.65 },
        "fixed_black_plastic": { color: "#111410", roughness: 0.42, metalness: 0 },
        "fixed_black_wood": { color: "#17110f", roughness: 0.5, metalness: 0 },
        "fixed_glass": { color: "#dbe7e4", roughness: 0.12, metalness: 0, opacity: 0.36 },
        "White plastic": { color: "#f2f1ec", roughness: 0.48, metalness: 0 },
        "Very dark red wood": { color: "#4a1c17", roughness: 0.42, metalness: 0, clearMaps: true },
        "Very dark red wood_2": { color: "#4a1c17", roughness: 0.42, metalness: 0, clearMaps: true },
        "Very dark red wood3": { color: "#4a1c17", roughness: 0.42, metalness: 0, clearMaps: true },
        "Stainless steel": { color: "#c4c4bc", roughness: 0.22, metalness: 0.85 },
        "Steel with procedural imperfections": { color: "#9c9d96", roughness: 0.26, metalness: 0.75 },
        "Scratched black metal": { color: "#111410", roughness: 0.28, metalness: 0.65 },
        "Black plastic": { color: "#111410", roughness: 0.42, metalness: 0 },
        "Black wood": { color: "#17110f", roughness: 0.5, metalness: 0 },
        "Blur Translucent Glass (glass)": { color: "#dbe7e4", roughness: 0.12, metalness: 0, opacity: 0.36 },
        "Inner_body": { color: "#f1ede7", roughness: 0.5, metalness: 0 },
        "Material_001": { color: "#f1ede7", roughness: 0.5, metalness: 0 },
        "Material_003": { color: "#f1ede7", roughness: 0.5, metalness: 0 },
        "metal": { color: "#c4c4bc", roughness: 0.2, metalness: 0.85 },
      };

      const state = { hull: null, cushions: null, teak: null };
      const stage = document.querySelector("[data-stage]");
      const loader = document.querySelector("[data-loader]");
      const downloadButton = document.querySelector("[data-download]");
      const resetButton = document.querySelector("[data-reset]");
      const configurableMaterials = { hull: [], cushions: [], teak: [] };
      const textureCache = { cushions: new Map(), teak: new Map(), tinted: new Map() };

      const scene = new THREE.Scene();
      scene.background = null;

      const camera = new THREE.PerspectiveCamera(35, 1, 0.1, 1000);
      const renderer = new THREE.WebGLRenderer({
        antialias: !compat.lowMemory,
        alpha: true,
        preserveDrawingBuffer: true,
        powerPreference: compat.isAndroid ? "low-power" : "high-performance",
      });
      renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, compat.maxPixelRatio || 2));
      renderer.outputColorSpace = THREE.SRGBColorSpace;
      renderer.toneMapping = THREE.ACESFilmicToneMapping;
      renderer.toneMappingExposure = 1.05;
      stage.appendChild(renderer.domElement);

      const controls = new OrbitControls(camera, renderer.domElement);
      controls.enableDamping = true;
      controls.dampingFactor = 0.075;
      controls.enablePan = false;
      controls.enableZoom = true;
      controls.minDistance = 62;
      controls.maxDistance = 160;
      controls.autoRotate = true;
      controls.autoRotateSpeed = 0.28;

      const ambient = new THREE.HemisphereLight(0xffffff, 0xd8ddd5, 2.15);
      scene.add(ambient);

      const key = new THREE.DirectionalLight(0xffffff, 4.1);
      key.position.set(-35, 50, 36);
      scene.add(key);

      const rim = new THREE.DirectionalLight(0xe8fff1, 1.8);
      rim.position.set(44, 18, -30);
      scene.add(rim);

      controls.addEventListener("start", () => {
        controls.autoRotate = false;
      });

      renderer.domElement.addEventListener("webglcontextlost", (event) => {
        event.preventDefault();
        fallbackTo360("webgl-context-lost");
      });

      function fallbackTo360(reason) {
        if (compat.force3d) {
          loader.textContent = "3D model kon niet stabiel worden geladen.";
          return;
        }
        window.location.replace(`360.html?fallback=${encodeURIComponent(reason)}`);
      }

      function materialRole(name) {
        if (roleMaterials.hull.has(name)) return "hull";
        if (roleMaterials.cushions.has(name)) return "cushions";
        if (roleMaterials.teak.has(name)) return "teak";
        return null;
      }

      function hexToRgb(hex) {
        const clean = hex.replace("#", "");
        return {
          r: parseInt(clean.slice(0, 2), 16),
          g: parseInt(clean.slice(2, 4), 16),
          b: parseInt(clean.slice(4, 6), 16),
        };
      }

      function clamp(value) {
        return Math.max(0, Math.min(255, Math.round(value)));
      }

      function shade(hex, amount) {
        const color = hexToRgb(hex);
        return `rgb(${clamp(color.r + amount)}, ${clamp(color.g + amount)}, ${clamp(color.b + amount)})`;
      }

      function createCanvasTexture(size, draw, colorSpace = THREE.SRGBColorSpace) {
        const canvas = document.createElement("canvas");
        canvas.width = size;
        canvas.height = size;
        draw(canvas.getContext("2d"), size);
        const texture = new THREE.CanvasTexture(canvas);
        texture.colorSpace = colorSpace;
        texture.wrapS = THREE.RepeatWrapping;
        texture.wrapT = THREE.RepeatWrapping;
        texture.anisotropy = renderer.capabilities.getMaxAnisotropy();
        texture.needsUpdate = true;
        return texture;
      }

      function makeTintedTexture(sourceTexture, targetHex, mode) {
        const source = sourceTexture && sourceTexture.image;
        if (!source) return null;

        const key = `${sourceTexture.uuid}:${targetHex}:${mode}`;
        if (textureCache.tinted.has(key)) return textureCache.tinted.get(key);

        const width = source.width || 1024;
        const height = source.height || 1024;
        const canvas = document.createElement("canvas");
        canvas.width = width;
        canvas.height = height;
        const ctx = canvas.getContext("2d", { willReadFrequently: true });
        ctx.drawImage(source, 0, 0, width, height);

        const imageData = ctx.getImageData(0, 0, width, height);
        const pixels = imageData.data;
        const tint = hexToRgb(targetHex);

        for (let index = 0; index < pixels.length; index += 4) {
          const r = pixels[index];
          const g = pixels[index + 1];
          const b = pixels[index + 2];
          const luminance = (0.299 * r + 0.587 * g + 0.114 * b) / 255;
          const variation = mode === "teak" ? (luminance - 0.5) * 54 : (luminance - 0.5) * 34;
          const textureWeight = mode === "teak" ? 0.18 : 0.26;

          pixels[index] = clamp(tint.r + variation + (r - tint.r) * textureWeight);
          pixels[index + 1] = clamp(tint.g + variation + (g - tint.g) * textureWeight);
          pixels[index + 2] = clamp(tint.b + variation + (b - tint.b) * textureWeight);
        }

        ctx.putImageData(imageData, 0, 0);
        const texture = new THREE.CanvasTexture(canvas);
        texture.colorSpace = THREE.SRGBColorSpace;
        texture.wrapS = sourceTexture.wrapS;
        texture.wrapT = sourceTexture.wrapT;
        texture.repeat.copy(sourceTexture.repeat);
        texture.offset.copy(sourceTexture.offset);
        texture.center.copy(sourceTexture.center);
        texture.rotation = sourceTexture.rotation;
        texture.flipY = sourceTexture.flipY;
        texture.anisotropy = renderer.capabilities.getMaxAnisotropy();
        texture.needsUpdate = true;
        textureCache.tinted.set(key, texture);
        return texture;
      }

      function getTeakTexture(color) {
        if (textureCache.teak.has(color)) return textureCache.teak.get(color);
        const texture = createCanvasTexture(512, (ctx, size) => {
          ctx.fillStyle = color;
          ctx.fillRect(0, 0, size, size);

          for (let x = 0; x < size; x += 42) {
            ctx.fillStyle = shade(color, (x / 42) % 2 ? -10 : 8);
            ctx.fillRect(x, 0, 42, size);
            ctx.fillStyle = "rgba(44, 32, 24, .55)";
            ctx.fillRect(x, 0, 2, size);
            ctx.fillStyle = "rgba(255, 255, 255, .25)";
            ctx.fillRect(x + 3, 0, 1, size);
          }

          for (let y = 5; y < size; y += 13) {
            ctx.strokeStyle = "rgba(58, 43, 31, .17)";
            ctx.lineWidth = 1;
            ctx.beginPath();
            ctx.moveTo(0, y);
            for (let x = 0; x <= size; x += 32) {
              ctx.lineTo(x, y + Math.sin((x + y) * 0.04) * 2);
            }
            ctx.stroke();
          }
        });
        texture.repeat.set(7, 3.6);
        textureCache.teak.set(color, texture);
        return texture;
      }

      function getTeakBumpTexture() {
        const key = "bump";
        if (textureCache.teak.has(key)) return textureCache.teak.get(key);
        const texture = createCanvasTexture(512, (ctx, size) => {
          ctx.fillStyle = "#808080";
          ctx.fillRect(0, 0, size, size);
          for (let x = 0; x < size; x += 42) {
            ctx.fillStyle = "#4f4f4f";
            ctx.fillRect(x, 0, 2, size);
            ctx.fillStyle = "#9c9c9c";
            ctx.fillRect(x + 3, 0, 1, size);
          }
          for (let y = 5; y < size; y += 13) {
            ctx.strokeStyle = "#747474";
            ctx.lineWidth = 1;
            ctx.beginPath();
            ctx.moveTo(0, y);
            for (let x = 0; x <= size; x += 32) {
              ctx.lineTo(x, y + Math.sin((x + y) * 0.04) * 2);
            }
            ctx.stroke();
          }
        }, THREE.NoColorSpace);
        texture.repeat.set(7, 3.6);
        textureCache.teak.set(key, texture);
        return texture;
      }

      function getCushionTexture(color) {
        if (textureCache.cushions.has(color)) return textureCache.cushions.get(color);
        const texture = createCanvasTexture(512, (ctx, size) => {
          ctx.fillStyle = color;
          ctx.fillRect(0, 0, size, size);

          ctx.lineWidth = 5;
          for (let offset = -size; offset < size * 2; offset += 54) {
            ctx.strokeStyle = "rgba(80, 55, 45, .24)";
            ctx.beginPath();
            ctx.moveTo(offset, 0);
            ctx.lineTo(offset + size, size);
            ctx.stroke();

            ctx.strokeStyle = "rgba(255, 255, 255, .24)";
            ctx.beginPath();
            ctx.moveTo(offset + 5, 0);
            ctx.lineTo(offset + size + 5, size);
            ctx.stroke();

            ctx.strokeStyle = "rgba(80, 55, 45, .22)";
            ctx.beginPath();
            ctx.moveTo(offset, size);
            ctx.lineTo(offset + size, 0);
            ctx.stroke();

            ctx.strokeStyle = "rgba(255, 255, 255, .2)";
            ctx.beginPath();
            ctx.moveTo(offset + 5, size);
            ctx.lineTo(offset + size + 5, 0);
            ctx.stroke();
          }

          ctx.fillStyle = "rgba(255, 255, 255, .08)";
          for (let y = 0; y < size; y += 54) {
            for (let x = (y / 54) % 2 ? 27 : 0; x < size; x += 54) {
              ctx.beginPath();
              ctx.ellipse(x + 27, y + 27, 11, 7, Math.PI / 4, 0, Math.PI * 2);
              ctx.fill();
            }
          }
        });
        texture.repeat.set(2.8, 2.8);
        textureCache.cushions.set(color, texture);
        return texture;
      }

      function getCushionBumpTexture() {
        const key = "bump";
        if (textureCache.cushions.has(key)) return textureCache.cushions.get(key);
        const texture = createCanvasTexture(512, (ctx, size) => {
          ctx.fillStyle = "#868686";
          ctx.fillRect(0, 0, size, size);
          ctx.lineWidth = 6;
          for (let offset = -size; offset < size * 2; offset += 54) {
            ctx.strokeStyle = "#555";
            ctx.beginPath();
            ctx.moveTo(offset, 0);
            ctx.lineTo(offset + size, size);
            ctx.stroke();
            ctx.beginPath();
            ctx.moveTo(offset, size);
            ctx.lineTo(offset + size, 0);
            ctx.stroke();
            ctx.strokeStyle = "#aaa";
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.moveTo(offset + 5, 0);
            ctx.lineTo(offset + size + 5, size);
            ctx.stroke();
            ctx.beginPath();
            ctx.moveTo(offset + 5, size);
            ctx.lineTo(offset + size + 5, 0);
            ctx.stroke();
            ctx.lineWidth = 6;
          }
        }, THREE.NoColorSpace);
        texture.repeat.set(2.8, 2.8);
        textureCache.cushions.set(key, texture);
        return texture;
      }

      function applyMaterialStyle(material, style) {
        material.color.set(style.color);
        material.roughness = style.roughness;
        material.metalness = style.metalness;
        if (style.clearMaps) {
          material.map = null;
          material.normalMap = null;
          material.roughnessMap = null;
          material.metalnessMap = null;
          material.bumpMap = null;
        }
        if (style.opacity) {
          material.opacity = style.opacity;
          material.transparent = true;
          material.depthWrite = false;
        }
        material.needsUpdate = true;
      }

      function restoreOriginalMaps(material, role) {
        const hasOriginalTexture = Boolean(material.userData.originalMap);
        material.color.set(hasOriginalTexture && role === "teak" ? "#ffffff" : defaultColors[role]);
        material.map = role === "cushions" ? null : material.userData.originalMap || null;
        material.normalMap = material.userData.originalNormalMap || null;
        material.roughnessMap = material.userData.originalRoughnessMap || null;
        material.metalnessMap = material.userData.originalMetalnessMap || null;
        material.bumpMap = null;
        material.bumpScale = 0;
      }

      function applyRoleLook(material, role, color) {
        const hasCustomColor = Boolean(color);
        const selectedColor = color || defaultColors[role];
        material.userData.role = role;

        if (role === "teak") {
          if (material.userData.originalMap) {
            material.color.set(selectedColor);
            material.map = material.userData.originalMap;
            material.normalMap = material.userData.originalNormalMap || null;
            material.roughnessMap = material.userData.originalRoughnessMap || null;
            material.metalnessMap = material.userData.originalMetalnessMap || null;
            material.bumpMap = null;
            material.bumpScale = 0;
          } else {
            material.color.set("#ffffff");
            material.map = getTeakTexture(selectedColor);
            material.normalMap = null;
            material.roughnessMap = null;
            material.metalnessMap = null;
            material.bumpMap = getTeakBumpTexture();
            material.bumpScale = 0.025;
          }
          material.roughness = hasCustomColor ? 0.7 : 0.76;
          material.metalness = 0;
        } else if (role === "cushions") {
          if (
            material.userData.originalMap ||
            material.userData.originalNormalMap ||
            material.userData.originalRoughnessMap ||
            material.userData.originalMetalnessMap
          ) {
            material.color.set(selectedColor);
            material.map = null;
            material.normalMap = material.userData.originalNormalMap || null;
            material.roughnessMap = material.userData.originalRoughnessMap || null;
            material.metalnessMap = material.userData.originalMetalnessMap || null;
            material.bumpMap = null;
            material.bumpScale = 0;
          } else {
            material.color.set("#ffffff");
            material.map = getCushionTexture(selectedColor);
            material.normalMap = null;
            material.roughnessMap = null;
            material.metalnessMap = null;
            material.bumpMap = getCushionBumpTexture();
            material.bumpScale = 0.018;
          }
          material.roughness = 0.86;
          material.metalness = 0;
        } else {
          material.color.set(selectedColor);
          material.map = null;
          material.bumpMap = null;
          material.bumpScale = 0;
          material.roughness = 0.32;
          material.metalness = 0.38;
        }

        if (material.map) material.map.needsUpdate = true;
        if (material.bumpMap) material.bumpMap.needsUpdate = true;
        material.needsUpdate = true;
      }

      function prepareMaterial(material) {
        const role = materialRole(material.name);
        material = material.clone();
        material.envMapIntensity = 0.75;
        material.userData.originalMap = material.map || null;
        material.userData.originalNormalMap = material.normalMap || null;
        material.userData.originalRoughnessMap = material.roughnessMap || null;
        material.userData.originalMetalnessMap = material.metalnessMap || null;

        if (role) {
          applyRoleLook(material, role, null);
          configurableMaterials[role].push(material);
          return material;
        }

        const style = fixedMaterialStyles[material.name] || { color: "#d2d1c9", roughness: 0.54, metalness: 0 };
        applyMaterialStyle(material, style);
        return material;
      }

      function prepareMesh(mesh) {
        mesh.castShadow = true;
        mesh.receiveShadow = true;
        if (Array.isArray(mesh.material)) {
          mesh.material = mesh.material.map(prepareMaterial);
        } else if (mesh.material) {
          mesh.material = prepareMaterial(mesh.material);
        }
      }

      function frameModel(model) {
        const box = new THREE.Box3().setFromObject(model);
        const center = box.getCenter(new THREE.Vector3());
        const size = box.getSize(new THREE.Vector3());
        const maxDim = Math.max(size.x, size.y, size.z);

        model.position.sub(center);
        model.rotation.y = -0.56;
        model.rotation.x = -0.02;

        controls.target.set(0, 2, 0);
        camera.position.set(-maxDim * 0.62, maxDim * 0.38, maxDim * 0.95);
        camera.near = maxDim / 100;
        camera.far = maxDim * 10;
        camera.updateProjectionMatrix();
        controls.update();
      }

      function setRoleColor(role, value) {
        configurableMaterials[role].forEach((material) => {
          applyRoleLook(material, role, value);
        });
      }

      function renderPanels() {
        document.querySelectorAll("[data-panel]").forEach((panel) => {
          const role = panel.dataset.panel;
          const swatches = panel.querySelector(".swatches");
          const chosen = panel.querySelector("[data-chosen]");
          const original = panel.querySelector(".original-link");
          swatches.innerHTML = "";

          colors[role].forEach((color) => {
            const button = document.createElement("button");
            button.className = "swatch";
            button.type = "button";
            button.style.setProperty("--swatch", color.value);
            button.setAttribute("aria-label", color.name);
            button.title = color.name;
            button.addEventListener("click", () => {
              state[role] = color.value;
              setRoleColor(role, color.value);
              renderPanels();
            });
            if (state[role] === color.value) {
              button.classList.add("selected");
            }
            swatches.appendChild(button);
          });

          original.onclick = () => {
            state[role] = null;
            setRoleColor(role, null);
            renderPanels();
          };

          const selected = colors[role].find((item) => item.value === state[role]);
          chosen.textContent = selected ? selected.name : "Origineel";
        });
      }

      function resize() {
        const width = stage.clientWidth;
        const height = stage.clientHeight;
        renderer.setSize(width, height, false);
        camera.aspect = width / Math.max(height, 1);
        camera.updateProjectionMatrix();
      }

      function animate() {
        requestAnimationFrame(animate);
        controls.update();
        renderer.render(scene, camera);
      }

      function reset() {
        state.hull = null;
        state.cushions = null;
        state.teak = null;
        Object.keys(state).forEach((role) => setRoleColor(role, null));
        controls.reset();
        renderPanels();
      }

      function downloadImage() {
        renderer.render(scene, camera);
        const link = document.createElement("a");
        link.download = "mijn-dammer-3d-configuratie.png";
        link.href = renderer.domElement.toDataURL("image/png");
        link.click();
      }

      renderPanels();
      resize();
      animate();
      window.addEventListener("resize", resize);
      resetButton.addEventListener("click", reset);
      downloadButton.addEventListener("click", downloadImage);

      const modelLoadTimer = window.setTimeout(() => {
        fallbackTo360("3d-timeout");
      }, compat.loadTimeoutMs || 30000);

      new GLTFLoader().load(
        "images/dammer-boat-blender-v3-web.glb?v=1",
        (gltf) => {
          window.clearTimeout(modelLoadTimer);
          const model = gltf.scene;
          model.traverse((object) => {
            if (object.isMesh) prepareMesh(object);
          });
          scene.add(model);
          frameModel(model);
          loader.remove();
          downloadButton.disabled = false;
        },
        (event) => {
          if (event.total) {
            const progress = Math.round((event.loaded / event.total) * 100);
            loader.textContent = `Dammer wordt geladen... ${progress}%`;
          }
        },
        () => {
          window.clearTimeout(modelLoadTimer);
          fallbackTo360("3d-load-error");
        }
      );
    </script>
  </body>
</html>
