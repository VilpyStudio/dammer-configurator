<!doctype html>
<html lang="nl">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Dammer Beurs Configurator</title>
    <meta name="description" content="Configureer de Dammer met stabiele 360 renders voor touchscreens.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700;800&display=swap" rel="stylesheet">
    <style>
      :root {
        --ink: #172019;
        --muted: #667069;
        --line: #dfe3df;
        --green: #174d2c;
        --paper: #fff;
        --font-main: "Archivo", Arial, Helvetica, sans-serif;
      }

      * {
        box-sizing: border-box;
      }

      html {
        background: #f4f6f3;
        touch-action: manipulation;
      }

      body {
        margin: 0;
        min-width: 320px;
        background: #fbfcfa;
        color: var(--ink);
        font-family: var(--font-main);
        overflow-x: hidden;
        -webkit-text-size-adjust: 100%;
      }

      button {
        -webkit-tap-highlight-color: transparent;
        font: inherit;
      }

      .site-shell {
        min-height: 100vh;
      }

      .topbar {
        align-items: center;
        background: var(--paper);
        border-bottom: 1px solid var(--line);
        display: flex;
        height: 82px;
        justify-content: space-between;
        max-width: 100vw;
        padding: 0 24px;
        padding: 0 clamp(24px, 4vw, 72px);
        width: 100%;
      }

      .brand img {
        display: block;
        height: auto;
        max-width: min(280px, 48vw);
        width: 230px;
      }

      .topbar-actions {
        align-items: center;
        display: flex;
        gap: 18px;
      }

      .reset-button,
      .flat-link,
      .original-link {
        background: transparent;
        border: 0;
        color: #4d5850;
        cursor: pointer;
        font-size: 13px;
        font-weight: 700;
        text-decoration: underline;
        text-decoration-color: #aeb5af;
        text-underline-offset: 5px;
      }

      .configurator {
        display: grid;
        grid-template-columns: minmax(0, 1fr) minmax(340px, 440px);
        min-height: calc(100vh - 82px);
      }

      .viewer {
        background: radial-gradient(circle at 58% 47%, rgba(255,255,255,.98), rgba(248,249,246,.86) 48%, rgba(241,244,240,.94) 86%), #f3f5f1;
        display: grid;
        grid-template-rows: auto minmax(0, 1fr) auto;
        overflow: hidden;
        padding: 32px 32px 18px;
        padding: clamp(26px, 3.2vw, 48px) clamp(24px, 4vw, 66px) 18px;
        position: relative;
      }

      .viewer-copy {
        position: relative;
        z-index: 2;
      }

      .viewer-copy span {
        color: var(--green);
        display: block;
        font-size: 12px;
        font-weight: 700;
        margin-bottom: 14px;
        text-transform: uppercase;
      }

      .viewer-copy h1 {
        font-size: 42px;
        font-size: clamp(30px, 3vw, 48px);
        font-weight: 700;
        line-height: 1.06;
        margin: 0;
        max-width: 680px;
      }

      .stage {
        align-items: center;
        cursor: grab;
        display: flex;
        justify-content: center;
        min-height: 0;
        position: relative;
        -ms-touch-action: none;
        touch-action: none;
        user-select: none;
      }

      .stage.dragging {
        cursor: grabbing;
      }

      .stage canvas {
        display: block;
        filter: drop-shadow(0 28px 34px rgba(30,42,33,.12));
        height: auto;
        max-height: min(76vh, 820px);
        max-width: 100%;
        width: auto;
      }

      .loader {
        color: #717a73;
        font-size: 13px;
        left: 50%;
        position: absolute;
        top: 50%;
        transform: translate(-50%, -50%);
        z-index: 2;
      }

      .viewer-note {
        color: #7a817c;
        font-size: 10px;
        margin: 0;
        position: relative;
        text-align: center;
        z-index: 2;
      }

      .controls {
        background: var(--paper);
        border-left: 1px solid var(--line);
        padding: 42px 34px;
        padding: clamp(34px, 4vw, 64px) clamp(28px, 3.4vw, 52px);
      }

      .controls-intro {
        align-items: center;
        border-bottom: 1px solid var(--line);
        display: flex;
        gap: 14px;
        padding-bottom: 26px;
      }

      .step {
        align-items: center;
        background: var(--green);
        border-radius: 50%;
        color: #fff;
        display: flex;
        font-size: 11px;
        font-weight: 700;
        height: 38px;
        justify-content: center;
        width: 38px;
      }

      .controls-intro p {
        color: #7b837d;
        font-size: 10px;
        font-weight: 700;
        margin: 0 0 6px;
        text-transform: uppercase;
      }

      .controls-intro h2 {
        font-size: 25px;
        font-weight: 700;
        line-height: 1;
        margin: 0;
      }

      .control-group {
        border-bottom: 1px solid var(--line);
        padding: 27px 0;
      }

      .control-heading {
        align-items: baseline;
        display: flex;
        justify-content: space-between;
        margin-bottom: 17px;
      }

      .control-heading h2 {
        font-size: 14px;
        font-weight: 700;
        margin: 0;
      }

      .control-heading span {
        color: #788179;
        font-size: 11px;
        font-weight: 600;
      }

      .swatches {
        display: flex;
        flex-wrap: wrap;
        gap: 11px;
      }

      .swatch {
        background: var(--swatch, #fff);
        border: 3px solid #fff;
        border-radius: 50%;
        box-shadow: 0 0 0 1px #cdd2ce;
        cursor: pointer;
        height: 38px;
        position: relative;
        transition: transform .15s ease, box-shadow .15s ease;
        width: 38px;
      }

      .swatch:hover {
        transform: translateY(-2px);
      }

      .swatch.selected {
        box-shadow: 0 0 0 2px var(--green), 0 4px 10px rgba(23,77,44,.18);
      }

      .swatch.selected::after {
        border: solid #fff;
        border-width: 0 2px 2px 0;
        content: "";
        height: 8px;
        left: 13px;
        position: absolute;
        top: 10px;
        transform: rotate(45deg);
        width: 4px;
      }

      .original-link {
        font-size: 10px;
        font-weight: 600;
        margin-top: 15px;
        padding: 0;
      }

      .download-button {
        align-items: center;
        background: var(--green);
        border: 0;
        color: #fff;
        cursor: pointer;
        display: flex;
        font-size: 13px;
        font-weight: 700;
        justify-content: space-between;
        margin-top: 30px;
        padding: 17px 19px;
        transition: background .18s ease, transform .18s ease;
        width: 100%;
      }

      .download-button:hover:not(:disabled) {
        background: #0e3d20;
        transform: translateY(-1px);
      }

      .download-button:disabled {
        cursor: wait;
        opacity: .55;
      }

      .save-note {
        color: #858c87;
        font-size: 10px;
        margin: 10px 0 0;
        text-align: center;
      }

      @media (max-width: 1000px) {
        .configurator {
          grid-template-columns: 1fr;
        }

        .viewer {
          min-height: auto;
        }

        .controls {
          border-left: 0;
          border-top: 1px solid var(--line);
        }
      }

      @media (max-width: 640px) {
        .topbar {
          height: 64px;
          padding: 0 12px;
        }

        .brand img {
          width: 150px;
        }

        .reset-button {
          font-size: 11px;
          white-space: nowrap;
        }

        .topbar-actions {
          display: flex;
          gap: 12px;
        }

        .viewer {
          grid-template-rows: auto auto auto;
          padding: 18px 16px 10px;
        }

        .viewer-copy span {
          font-size: 10px;
          margin-bottom: 7px;
        }

        .viewer-copy h1 {
          font-size: 24px;
          font-size: clamp(21px, 6.4vw, 27px);
          line-height: 1.04;
          max-width: 280px;
        }

        .stage {
          margin: 0 0 -8px;
          overflow: hidden;
        }

        .stage canvas {
          max-height: none;
          max-width: 100%;
          transform: translateY(-5%);
          width: 100%;
        }

        .viewer-note {
          font-size: 8px;
          line-height: 1.35;
          margin: -8px auto 0;
          max-width: 260px;
          padding: 0;
        }

        .controls {
          padding: 28px 22px 36px;
        }
      }
    </style>
  </head>
  <body>
    <main class="site-shell">
      <header class="topbar">
        <a class="brand" href="/beurs" aria-label="Dammer beursconfigurator">
          <img src="images/dammer-logo.svg?v=20260825-2130" alt="Dammer 700">
        </a>
        <div class="topbar-actions">
          <button class="reset-button" type="button" data-reset>Opnieuw instellen</button>
        </div>
      </header>

      <div class="configurator">
        <section class="viewer" aria-label="Sleepbare beursconfigurator van de Dammer">
          <div class="viewer-copy">
            <span>Stel jouw uitvoering samen</span>
            <h1>Maak de Dammer van jou.</h1>
          </div>
          <div class="stage" data-stage>
            <div class="loader" data-loader>Dammer renders worden geladen...</div>
            <canvas width="1280" height="900" aria-label="Sleepbare Dammer met gekozen kleuren"></canvas>
          </div>
          <p class="viewer-note">Kleuren op het scherm kunnen afwijken van de werkelijke materialen.</p>
        </section>

        <aside class="controls">
          <div class="controls-intro">
            <span class="step">01</span>
            <div>
              <p>Exterieur &amp; interieur</p>
              <h2>Kies je kleuren</h2>
            </div>
          </div>

          <section class="control-group" data-panel="hull">
            <div class="control-heading">
              <h2>Romp</h2>
              <span data-chosen>Origineel</span>
            </div>
            <div class="swatches"></div>
            <button class="original-link" type="button">Gebruik originele kleur</button>
          </section>

          <section class="control-group" data-panel="cushions">
            <div class="control-heading">
              <h2>Kussens</h2>
              <span data-chosen>Origineel</span>
            </div>
            <div class="swatches"></div>
            <button class="original-link" type="button">Gebruik originele kleur</button>
          </section>

          <section class="control-group" data-panel="teak">
            <div class="control-heading">
              <h2>Teakdeck</h2>
              <span data-chosen>Origineel</span>
            </div>
            <div class="swatches"></div>
            <button class="original-link" type="button">Gebruik originele kleur</button>
          </section>

          <button class="download-button" type="button" data-download disabled>
            <span>Download jouw ontwerp</span>
            <span aria-hidden="true">&#8595;</span>
          </button>
          <p class="save-note">Je ontwerp wordt als PNG opgeslagen.</p>
        </aside>
      </div>
    </main>

    <script src="legacy-360.js?v=20260826-beurs1"></script>
  </body>
</html>
